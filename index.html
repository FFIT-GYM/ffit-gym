<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FFIT GYM | Book Your Session</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
    /* BASE STYLES */
    body {
        font-family: 'Roboto', sans-serif;
        margin: 0;
        padding: 0;
        background: #fff;
        color: #111;
        scroll-behavior: smooth;
    }

    header {
        background-color: #0d3b66; /* Deep blue */
        color: #f4d35e; /* Gold */
        padding: 25px 20px;
        text-align: center;
    }

    header h1 {
        margin: 0;
        font-size: 2.5em;
    }

    header p {
        margin: 5px 0 0;
        font-size: 1.2em;
    }

    nav {
        display: flex;
        justify-content: center;
        background: #fafafa;
        border-bottom: 1px solid #ddd;
    }

    nav a {
        padding: 15px 25px;
        font-weight: bold;
        color: #0d3b66;
        text-decoration: none;
    }

    nav a:hover {
        color: #f95738;
    }

    section {
        padding: 60px 20px;
        max-width: 800px;
        margin: auto;
    }

    h2 {
        text-align: center;
        color: #0d3b66;
        margin-bottom: 20px;
    }

    form {
        display: flex;
        flex-direction: column;
        gap: 15px;
        background: #f4f4f4;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    input, select, textarea, button {
        padding: 12px 15px;
        border-radius: 8px;
        border: 1px solid #ddd;
        font-size: 1em;
        width: 100%;
        box-sizing: border-box;
    }

    textarea {
        resize: vertical;
        min-height: 80px;
    }

    button {
        background-color: #f95738;
        color: #fff;
        border: none;
        cursor: pointer;
        font-weight: bold;
        transition: 0.3s;
    }

    button:hover {
        background-color: #f4d35e;
        color: #0d3b66;
    }

    footer {
        text-align: center;
        padding: 20px;
        background: #0d3b66;
        color: #f4d35e;
        margin-top: 50px;
    }

    @media(max-width:600px){
        header h1 { font-size:2em; }
        nav { flex-direction: column; }
        nav a { padding:10px 0; }
